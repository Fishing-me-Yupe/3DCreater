<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D UV Paint Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: #1e1e1e;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* UV Editor Panel (大きめに配置) */
    #uv-panel {
      width: 420px;
      background: #181818;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      z-index: 10;
    }
    .panel-header {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #888;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    #uv-canvas-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #222;
      border: 1px solid #444;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
    }
    #texture-canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      display: block;
    }
    #uv-wire-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.5;
    }
    /* Controls Section */
    .controls-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tool-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      padding: 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #3a3a3a;
      border-color: #666;
    }
    button.active {
      background: #eee;
      color: #111;
      font-weight: bold;
      border-color: #fff;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #bbb;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }
    input[type="range"] {
      accent-color: #eee;
      width: 60%;
    }
    .info-box {
      font-size: 11px;
      color: #777;
      line-height: 1.4;
      background: #111;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #222;
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="viewport-container">
    <canvas id="three-canvas"></canvas>
  </div>

  <div id="uv-panel">
    <div class="panel-header">UV Texture Editor (Expanded)</div>
    
    <div id="uv-canvas-container">
      <canvas id="texture-canvas" width="1024" height="1024"></canvas>
      <canvas id="uv-wire-overlay" width="1024" height="1024"></canvas>
    </div>

    <div class="controls-group">
      <div class="panel-header">Tools</div>
      <div class="tool-buttons">
        <button id="tool-pen" class="active">ペン (Pen)</button>
        <button id="tool-pipette">スポイト</button>
        <button id="tool-grad">グラデーション</button>
      </div>

      <div class="setting-row">
        <label>描画色</label>
        <input type="color" id="color-primary" value="#ffffff">
      </div>

      <div class="setting-row" id="grad-color-row" style="display: none;">
        <label>グラデ終点色</label>
        <input type="color" id="color-secondary" value="#000000">
      </div>

      <div class="setting-row">
        <label>ブラシサイズ</label>
        <input type="range" id="brush-size" min="2" max="80" value="12">
      </div>
    </div>

    <div class="controls-group">
      <div class="panel-header">UV Unwrapping & Mesh</div>
      <button id="btn-re-uv">重なり防止: UV再割り当て</button>
      <button id="btn-add-mesh">隣接図形（立方体）を追加</button>
    </div>

    <div class="info-box">
      ・<strong>ペイント:</strong> 3Dビュー上、またはUVパネル上でドラッグ<br>
      ・<strong>スポイト:</strong> クリックした箇所の色を取得<br>
      ・<strong>グラデーション:</strong> ドラッグして開始点から終点へ反映
    </div>
  </div>

  <script>
    // --- 1. Texture Canvas Prep ---
    const texCanvas = document.getElementById('texture-canvas');
    const texCtx = texCanvas.getContext('2d');
    const overlayCanvas = document.getElementById('uv-wire-overlay');
    const overlayCtx = overlayCanvas.getContext('2d');

    // 初期キャンバス背景クリア
    texCtx.fillStyle = '#333333';
    texCtx.fillRect(0, 0, texCanvas.width, texCanvas.height);

    const texture = new THREE.CanvasTexture(texCanvas);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;

    // --- 2. Three.js Scene Setup ---
    const viewport = document.getElementById('viewport-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(2, 2, 4);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // --- 3. Unique Non-overlapping UV Mesh Generation ---
    const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.4 });
    let currentMesh;

    function createNonOverlappingSphere() {
      if (currentMesh) scene.remove(currentMesh);

      // 標準のSphereGeometryはUVが重なりにくい仕様
      const geometry = new THREE.SphereGeometry(1, 32, 16);
      currentMesh = new THREE.Mesh(geometry, material);
      scene.add(currentMesh);

      drawUVOverlay(geometry);
    }

    // UVワイヤーフレームの描画
    function drawUVOverlay(geometry) {
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      overlayCtx.lineWidth = 1;

      const uvAttr = geometry.attributes.uv;
      const indexAttr = geometry.index;
      const w = overlayCanvas.width;
      const h = overlayCanvas.height;

      if (indexAttr) {
        for (let i = 0; i < indexAttr.count; i += 3) {
          const i0 = indexAttr.getX(i);
          const i1 = indexAttr.getX(i + 1);
          const i2 = indexAttr.getX(i + 2);

          const u0 = uvAttr.getX(i0) * w, v0 = (1 - uvAttr.getY(i0)) * h;
          const u1 = uvAttr.getX(i1) * w, v1 = (1 - uvAttr.getY(i1)) * h;
          const u2 = uvAttr.getX(i2) * w, v2 = (1 - uvAttr.getY(i2)) * h;

          overlayCtx.beginPath();
          overlayCtx.moveTo(u0, v0);
          overlayCtx.lineTo(u1, v1);
          overlayCtx.lineTo(u2, v2);
          overlayCtx.closePath();
          overlayCtx.stroke();
        }
      }
    }

    createNonOverlappingSphere();

    // --- 4. Tool State & Events ---
    let currentTool = 'pen'; // pen, pipette, grad
    let isDrawing = false;
    let lastPoint = null;
    let gradStart = null;

    const primaryColorInput = document.getElementById('color-primary');
    const secondaryColorInput = document.getElementById('color-secondary');
    const brushSizeInput = document.getElementById('brush-size');

    // Tool switching
    document.getElementById('tool-pen').addEventListener('click', (e) => setTool('pen', e.target));
    document.getElementById('tool-pipette').addEventListener('click', (e) => setTool('pipette', e.target));
    document.getElementById('tool-grad').addEventListener('click', (e) => setTool('grad', e.target));

    function setTool(tool, btn) {
      currentTool = tool;
      document.querySelectorAll('.tool-buttons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('grad-color-row').style.display = tool === 'grad' ? 'flex' : 'none';
      controls.enabled = tool !== 'pen' || !isDrawing;
    }

    // --- 5. Painting Logic ---
    function applyPen(x, y, isFirst = false) {
      texCtx.fillStyle = primaryColorInput.value;
      texCtx.strokeStyle = primaryColorInput.value;
      texCtx.lineWidth = brushSizeInput.value;
      texCtx.lineCap = 'round';
      texCtx.lineJoin = 'round';

      if (isFirst || !lastPoint) {
        texCtx.beginPath();
        texCtx.arc(x, y, brushSizeInput.value / 2, 0, Math.PI * 2);
        texCtx.fill();
      } else {
        texCtx.beginPath();
        texCtx.moveTo(lastPoint.x, lastPoint.y);
        texCtx.lineTo(x, y);
        texCtx.stroke();
      }
      lastPoint = { x, y };
      texture.needsUpdate = true;
    }

    function applyPipette(x, y) {
      const pixel = texCtx.getImageData(x, y, 1, 1).data;
      const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
      primaryColorInput.value = hex;
    }

    function applyGradient(start, end) {
      const grad = texCtx.createLinearGradient(start.x, start.y, end.x, end.y);
      grad.addColorStop(0, primaryColorInput.value);
      grad.addColorStop(1, secondaryColorInput.value);
      texCtx.fillStyle = grad;
      texCtx.fillRect(0, 0, texCanvas.width, texCanvas.height);
      texture.needsUpdate = true;
    }

    // Raycasting for 3D Viewport Painting
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function getUVFromRaycast(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(currentMesh);

      if (intersects.length > 0 && intersects[0].uv) {
        const uv = intersects[0].uv;
        return {
          x: uv.x * texCanvas.width,
          y: (1 - uv.y) * texCanvas.height
        };
      }
      return null;
    }

    // Viewport Mouse Events
    const canvas3D = renderer.domElement;

    canvas3D.addEventListener('pointerdown', (e) => {
      const pt = getUVFromRaycast(e);
      if (!pt) return;

      isDrawing = true;
      controls.enabled = false;

      if (currentTool === 'pen') {
        applyPen(pt.x, pt.y, true);
      } else if (currentTool === 'pipette') {
        applyPipette(pt.x, pt.y);
      } else if (currentTool === 'grad') {
        gradStart = pt;
      }
    });

    canvas3D.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const pt = getUVFromRaycast(e);
      if (!pt) return;

      if (currentTool === 'pen') {
        applyPen(pt.x, pt.y);
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (isDrawing && currentTool === 'grad' && gradStart) {
        const pt = getUVFromRaycast(e) || gradStart;
        applyGradient(gradStart, pt);
      }
      isDrawing = false;
      lastPoint = null;
      gradStart = null;
      controls.enabled = true;
    });

    // 2D UV Panel Mouse Events
    texCanvas.addEventListener('pointerdown', (e) => {
      const rect = texCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (texCanvas.width / rect.width);
      const y = (e.clientY - rect.top) * (texCanvas.height / rect.height);

      isDrawing = true;

      if (currentTool === 'pen') {
        applyPen(x, y, true);
      } else if (currentTool === 'pipette') {
        applyPipette(x, y);
      } else if (currentTool === 'grad') {
        gradStart = { x, y };
      }
    });

    texCanvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const rect = texCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (texCanvas.width / rect.width);
      const y = (e.clientY - rect.top) * (texCanvas.height / rect.height);

      if (currentTool === 'pen') {
        applyPen(x, y);
      }
    });

    // --- 6. Additional Action Buttons ---
    document.getElementById('btn-re-uv').addEventListener('click', () => {
      createNonOverlappingSphere();
    });

    document.getElementById('btn-add-mesh').addEventListener('click', () => {
      // 隣接オブジェクトを追加（別マテリアルまたは個別のUV領域を適用）
      const boxGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      
      // 同じマテリアルを共有せず独立したテクスチャまたはマテリアルを分離することで干渉を防ぐ
      const boxMat = material.clone(); 
      const boxMesh = new THREE.Mesh(boxGeo, boxMat);
      boxMesh.position.set(1.5, 0, 0);
      scene.add(boxMesh);
    });

    // Render Loop & Resize
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });
  </script>
</body>
</html>
