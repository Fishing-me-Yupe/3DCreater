<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Creater - Extended</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 260px;
    }
    .ui-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ui-group label {
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }
    .ui-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    button {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f0f0f0;
      transition: background 0.2s;
    }
    button:hover {
      background: #e0e0e0;
    }
    button.active {
      background: #35bdcb;
      color: white;
      border-color: #2da1ad;
    }
    input[type="color"], input[type="range"] {
      cursor: pointer;
      width: 100%;
    }
  </style>

  <!-- Three.js & OrbitControls (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- UI パネル (キー操作なし・ボタン操作のみ) -->
  <div id="ui-container">
    <div class="ui-group">
      <label>モード選択</label>
      <div class="ui-row">
        <button id="btn-mode-paint" class="active">色塗り (Paint)</button>
        <button id="btn-mode-hair">髪の毛追加 (Hair)</button>
      </div>
    </div>

    <!-- 色塗りオプション -->
    <div id="paint-controls" class="ui-group">
      <label>色塗り設定</label>
      <div class="ui-row">
        <label>色:</label>
        <input type="color" id="paint-color" value="#ff0000">
      </div>
      <div class="ui-row">
        <label>筆サイズ:</label>
        <input type="range" id="paint-size" min="2" max="40" value="15">
      </div>
    </div>

    <!-- 髪の毛生成オプション -->
    <div id="hair-controls" class="ui-group" style="display: none;">
      <label>髪の毛（毛束）設定</label>
      <div class="ui-row">
        <label>髪の色:</label>
        <input type="color" id="hair-color" value="#35bdcb">
      </div>
      <button id="btn-add-hair">＋ 毛束を1本生成</button>
    </div>

    <!-- オブジェクト移動（ボタン操作のみ） -->
    <div class="ui-group">
      <label>オブジェクト位置移動</label>
      <div class="ui-row">
        <button id="btn-move-left">← 左</button>
        <button id="btn-move-right">右 →</button>
        <button id="btn-move-up">↑ 上</button>
        <button id="btn-move-down">↓ 下</button>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. シーン・カメラ・レンダラー・ライティング
    // ----------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 照明
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // ----------------------------------------------------
    // 2. テクスチャ書き込み用 Canvas & 立方体メッシュ
    // ----------------------------------------------------
    const texCanvas = document.createElement('canvas');
    texCanvas.width = 512;
    texCanvas.height = 512;
    const ctx = texCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 512, 512);

    const texture = new THREE.CanvasTexture(texCanvas);
    const cubeMaterial = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.4 });
    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
    const targetMesh = new THREE.Mesh(cubeGeometry, cubeMaterial);
    scene.add(targetMesh);

    // ----------------------------------------------------
    // 3. 髪の毛（毛先が細くなるテーパー毛束）の生成処理
    // ----------------------------------------------------
    function createTaperedHairStrand(points, baseRadius, colorHex) {
      const curve = new THREE.CatmullRomCurve3(points);
      const tubularSegments = 32;
      const radialSegments = 8;
      const geometry = new THREE.TubeGeometry(curve, tubularSegments, baseRadius, radialSegments, false);

      // 毛先に向かって縮小する頂点計算（テーパー処理）
      const posAttr = geometry.attributes.position;
      const vertex = new THREE.Vector3();

      for (let i = 0; i < posAttr.count; i++) {
        vertex.fromBufferAttribute(posAttr, i);
        const u = Math.floor(i / (radialSegments + 1)) / tubularSegments; // 0.0(根元) 〜 1.0(毛先)
        const scale = Math.max(0.01, 1.0 - Math.pow(u, 1.2)); // 毛先に向かって尖らせる

        // 中心線からの距離を調整
        const pointOnCurve = curve.getPointAt(u);
        vertex.sub(pointOnCurve).multiplyScalar(scale).add(pointOnCurve);
        posAttr.setXYZ(i, vertex.x, vertex.y, vertex.z);
      }
      geometry.computeVertexNormals();

      const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
      return new THREE.Mesh(geometry, material);
    }

    // ----------------------------------------------------
    // 4. ペイント・レイキャスト処理
    // ----------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDrawing = false;
    let currentMode = 'paint'; // 'paint' | 'hair'

    const paintColorInput = document.getElementById('paint-color');
    const paintSizeInput = document.getElementById('paint-size');

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#ui-container')) return; // UI操作時は除外
      isDrawing = true;
      if (currentMode === 'paint') paintOnMesh(e);
    });

    window.addEventListener('pointerup', () => { isDrawing = false; });

    window.addEventListener('pointermove', (e) => {
      if (isDrawing && currentMode === 'paint' && !e.target.closest('#ui-container')) {
        paintOnMesh(e);
      }
    });

    function paintOnMesh(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(targetMesh);

      if (intersects.length > 0) {
        controls.enabled = false; // ペイント中は視点移動を一時ロック
        const uv = intersects[0].uv;
        if (uv) {
          const x = uv.x * texCanvas.width;
          const y = (1 - uv.y) * texCanvas.height;

          ctx.fillStyle = paintColorInput.value;
          ctx.beginPath();
          ctx.arc(x, y, parseFloat(paintSizeInput.value), 0, Math.PI * 2);
          ctx.fill();

          texture.needsUpdate = true;
        }
      } else {
        controls.enabled = true;
      }
    }

    window.addEventListener('pointerup', () => { controls.enabled = true; });

    // ----------------------------------------------------
    // 5. UI イベント（モード切替・髪の追加・ボタン移動）
    // ----------------------------------------------------
    const btnPaint = document.getElementById('btn-mode-paint');
    const btnHair = document.getElementById('btn-mode-hair');
    const paintControls = document.getElementById('paint-controls');
    const hairControls = document.getElementById('hair-controls');

    btnPaint.addEventListener('click', () => {
      currentMode = 'paint';
      btnPaint.classList.add('active');
      btnHair.classList.remove('active');
      paintControls.style.display = 'flex';
      hairControls.style.display = 'none';
    });

    btnHair.addEventListener('click', () => {
      currentMode = 'hair';
      btnHair.classList.add('active');
      btnPaint.classList.remove('active');
      hairControls.style.display = 'flex';
      paintControls.style.display = 'none';
    });

    // 髪の毛追加ボタン
    document.getElementById('btn-add-hair').addEventListener('click', () => {
      const color = document.getElementById('hair-color').value;
      // ランダムに少し位置をずらして髪の毛を生成
      const offsetX = (Math.random() - 0.5) * 0.4;
      const points = [
        new THREE.Vector3(offsetX, 0.5, 0),
        new THREE.Vector3(offsetX + 0.1, 0.8, 0.2),
        new THREE.Vector3(offsetX + 0.2, 0.4, 0.5),
        new THREE.Vector3(offsetX + 0.3, -0.2, 0.7)
      ];
      const hairMesh = createTaperedHairStrand(points, 0.05, color);
      scene.add(hairMesh);
    });

    // 位置移動ボタン（キーボードなし）
    document.getElementById('btn-move-left').addEventListener('click', () => targetMesh.position.x -= 0.1);
    document.getElementById('btn-move-right').addEventListener('click', () => targetMesh.position.x += 0.1);
    document.getElementById('btn-move-up').addEventListener('click', () => targetMesh.position.y += 0.1);
    document.getElementById('btn-move-down').addEventListener('click', () => targetMesh.position.y -= 0.1);

    // リサイズ処理
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // アニメーションループ
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
