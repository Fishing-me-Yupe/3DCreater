<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Web3D Blender-style Studio</title>
  <style>
    :root {
      --bg-dark: #1e1e1e;
      --bg-panel: #2b2b2b;
      --bg-hover: #3a3a3a;
      --accent: #e67e22;
      --text: #cccccc;
      --border: #141414;
    }
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-dark); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; }
    #container { display: flex; width: 100vw; height: 100vh; }
    
    /* Viewport */
    #viewport-container { flex: 1; position: relative; height: 100%; }
    #canvas3d { width: 100%; height: 100%; display: block; }
    
    /* Overlay UI */
    #top-bar { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 10; background: rgba(43,43,43,0.85); padding: 6px; border-radius: 4px; border: 1px solid #444; }
    button, select, input[type="file"] { background: #383838; color: var(--text); border: 1px solid #555; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
    button:hover, button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    /* Panels */
    #sidebar { width: 320px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; z-index: 5; }
    .panel-section { border-bottom: 1px solid var(--border); padding: 10px; }
    .panel-title { font-weight: bold; margin-bottom: 8px; color: #fff; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; display: flex; justify-content: space-between; }
    
    .control-group { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .control-group label { flex: 1; }
    .control-group input[type="number"], .control-group input[type="range"], .control-group select { flex: 1; max-width: 130px; }
    
    /* UV Window */
    #uv-window { position: absolute; bottom: 20px; left: 20px; width: 280px; height: 280px; background: rgba(30,30,30,0.95); border: 1px solid #555; border-radius: 4px; display: flex; flex-direction: column; z-index: 10; }
    #uv-header { background: #333; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; cursor: move; }
    #uv-canvas { flex: 1; background: #111; width: 100%; height: 100%; }
    
    .color-picker-wrap { display: flex; gap: 5px; align-items: center; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

<div id="container">
  <div id="viewport-container">
    <div id="top-bar">
      <select id="modeSelect">
        <option value="object">オブジェクトモード</option>
        <option value="edit">編集モード (頂点操作)</option>
        <option value="sculpt">スカルプトモード</option>
        <option value="curve">ベジェ曲線モード</option>
        <option value="paint">UV 3Dペイントモード</option>
      </select>
      <button id="addCubeBtn">+ 立方体</button>
      <button id="addCurveBtn">+ ベジェ曲線</button>
      <button id="exportObjBtn" style="margin-left: auto; background: #27ae60;">.OBJ 出力</button>
    </div>

    <!-- Floating UV & Paint Window -->
    <div id="uv-window">
      <div id="uv-header">UV展開 & テクスチャペイント <span id="closeUv" style="cursor:pointer">×</span></div>
      <canvas id="uv-canvas" width="256" height="256"></canvas>
    </div>

    <canvas id="canvas3d"></canvas>
  </div>

  <!-- Right Sidebar -->
  <div id="sidebar">
    <!-- Symmetry & Modeling Settings -->
    <div class="panel-section">
      <div class="panel-title">対称モード (Symmetry)</div>
      <div class="control-group">
        <label>線対称 (X軸 Mirror)</label>
        <input type="checkbox" id="symX">
      </div>
      <div class="control-group">
        <label>点対称 (Point Sym)</label>
        <input type="checkbox" id="symPoint">
      </div>
    </div>

    <!-- Sculpt Settings -->
    <div class="panel-section" id="sculptPanel">
      <div class="panel-title">スカルプト設定</div>
      <div class="control-group">
        <label>ブラシ半径</label>
        <input type="range" id="brushRadius" min="0.1" max="2" step="0.1" value="0.5">
      </div>
      <div class="control-group">
        <label>ブラシ強度</label>
        <input type="range" id="brushIntensity" min="-0.5" max="0.5" step="0.02" value="0.1">
      </div>
    </div>

    <!-- Curve Settings -->
    <div class="panel-section" id="curvePanel">
      <div class="panel-title">曲線 (SVG/Bezier) 設定</div>
      <div class="control-group">
        <label>押し出し (Extrude)</label>
        <input type="range" id="curveExtrude" min="0" max="2" step="0.05" value="0.2">
      </div>
      <div class="control-group">
        <label>ベベル太さ</label>
        <input type="range" id="curveBevel" min="0" max="0.2" step="0.01" value="0.02">
      </div>
    </div>

    <!-- Material Settings -->
    <div class="panel-section">
      <div class="panel-title">材質 (Material PBR)</div>
      <div class="control-group">
        <label>基本色</label>
        <input type="color" id="matColor" value="#cccccc">
      </div>
      <div class="control-group">
        <label>粗さ (Roughness)</label>
        <input type="range" id="matRoughness" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="control-group">
        <label>金属度 (Metalness)</label>
        <input type="range" id="matMetalness" min="0" max="1" step="0.01" value="0.1">
      </div>
    </div>

    <!-- Texture & UV Paint Settings -->
    <div class="panel-section">
      <div class="panel-title">ペイント & UV設定</div>
      <div class="control-group">
        <label>筆色 (Paint)</label>
        <input type="color" id="paintColor" value="#ff0000">
      </div>
      <div class="control-group">
        <label>筆サイズ</label>
        <input type="range" id="paintSize" min="1" max="30" value="10">
      </div>
      <button id="clearTextureBtn" style="width: 100%; margin-top: 5px;">キャンバスをクリア</button>
    </div>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { TransformControls } from 'three/addons/controls/TransformControls.js';
  import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';

  // State Variables
  let scene, camera, renderer, orbit, transform;
  let activeMesh = null;
  let activeMode = 'object';
  
  // UV Canvas Context
  const uvCanvas = document.getElementById('uv-canvas');
  const uvCtx = uvCanvas.getContext('2d');
  let texture;

  init();
  animate();

  function init() {
    const container = document.getElementById('viewport-container');

    // 1. Scene, Camera, Renderer
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(4, 3, 5);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Grid & Lights
    scene.add(new THREE.GridHelper(10, 20, 0x555555, 0x333333));
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 2. Controls
    orbit = new OrbitControls(camera, renderer.domElement);
    transform = new TransformControls(camera, renderer.domElement);
    transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
    scene.add(transform);

    // 3. Initialize Dynamic UV Texture
    initUVCanvas();

    // Add Default Object
    createCube();

    // Event Listeners
    window.addEventListener('resize', onWindowResize);
    setupUI();
    setupRaycaster();
  }

  function initUVCanvas() {
    uvCtx.fillStyle = '#ffffff';
    uvCtx.fillRect(0, 0, uvCanvas.width, uvCanvas.height);
    texture = new THREE.CanvasTexture(uvCanvas);
  }

  function createCube() {
    if (activeMesh) scene.remove(activeMesh);

    // Subdivision added for sculpting/deformation support
    const geometry = new THREE.BoxGeometry(2, 2, 2, 16, 16, 16);
    const material = new THREE.MeshStandardMaterial({
      map: texture,
      roughness: 0.5,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    activeMesh = new THREE.Mesh(geometry, material);
    scene.add(activeMesh);
    transform.attach(activeMesh);
    drawUVOverlay();
  }

  function createBezierCurve() {
    if (activeMesh) scene.remove(activeMesh);

    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.bezierCurveTo(0, 1, 1, 1, 1, 0);
    shape.bezierCurveTo(1, -1, 2, -1, 2, 0);

    const extrudeSettings = {
      steps: 1,
      depth: parseFloat(document.getElementById('curveExtrude').value),
      bevelEnabled: true,
      bevelThickness: parseFloat(document.getElementById('curveBevel').value),
      bevelSize: parseFloat(document.getElementById('curveBevel').value),
      bevelSegments: 3
    };

    const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    geometry.center();

    const material = new THREE.MeshStandardMaterial({
      color: document.getElementById('matColor').value,
      roughness: 0.5,
      metalness: 0.1
    });

    activeMesh = new THREE.Mesh(geometry, material);
    scene.add(activeMesh);
    transform.attach(activeMesh);
  }

  // --- Symmetry & Sculpt Logic ---
  function applySculpt(hitPoint, intensity, radius) {
    if (!activeMesh || !activeMesh.geometry.attributes.position) return;

    const pos = activeMesh.geometry.attributes.position;
    const localHit = activeMesh.worldToLocal(hitPoint.clone());
    const symX = document.getElementById('symX').checked;
    const symPoint = document.getElementById('symPoint').checked;

    for (let i = 0; i < pos.count; i++) {
      const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
      
      // Original Point Push
      modifyVertex(v, localHit, intensity, radius);

      // X-Axis Mirror Symmetry
      if (symX) {
        const symHit = localHit.clone();
        symHit.x *= -1;
        modifyVertex(v, symHit, intensity, radius);
      }

      // Point Symmetry
      if (symPoint) {
        const symHit = localHit.clone().negate();
        modifyVertex(v, symHit, intensity, radius);
      }

      pos.setXYZ(i, v.x, v.y, v.z);
    }

    pos.needsUpdate = true;
    activeMesh.geometry.computeVertexNormals();
  }

  function modifyVertex(v, center, intensity, radius) {
    const dist = v.distanceTo(center);
    if (dist < radius) {
      const falloff = (1 - dist / radius);
      const dir = v.clone().sub(center).normalize();
      if (dir.length() === 0) dir.set(0, 1, 0);
      v.addScaledVector(dir, intensity * falloff);
    }
  }

  // --- UV & Paint Logic ---
  function applyPaint(uv) {
    const x = uv.x * uvCanvas.width;
    const y = (1 - uv.y) * uvCanvas.height;

    const color = document.getElementById('paintColor').value;
    const size = document.getElementById('paintSize').value;

    uvCtx.fillStyle = color;
    uvCtx.beginPath();
    uvCtx.arc(x, y, size, 0, Math.PI * 2);
    uvCtx.fill();

    texture.needsUpdate = true;
  }

  function drawUVOverlay() {
    // Draw simplified grid on UV preview
    uvCtx.strokeStyle = 'rgba(0,0,0,0.15)';
    uvCtx.lineWidth = 1;
    for (let i = 0; i < uvCanvas.width; i += 32) {
      uvCtx.beginPath(); uvCtx.moveTo(i, 0); uvCtx.lineTo(i, uvCanvas.height); uvCtx.stroke();
      uvCtx.beginPath(); uvCtx.moveTo(0, i); uvCtx.lineTo(uvCanvas.width, i); uvCtx.stroke();
    }
  }

  // --- Raycasting for Sculpting & Painting ---
  function setupRaycaster() {
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isMouseDown = false;

    window.addEventListener('mousedown', () => isMouseDown = true);
    window.addEventListener('mouseup', () => isMouseDown = false);

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown || !activeMesh) return;
      if (activeMode !== 'sculpt' && activeMode !== 'paint') return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(activeMesh);

      if (intersects.length > 0) {
        const hit = intersects[0];
        if (activeMode === 'sculpt') {
          const r = parseFloat(document.getElementById('brushRadius').value);
          const val = parseFloat(document.getElementById('brushIntensity').value);
          applySculpt(hit.point, val, r);
        } else if (activeMode === 'paint' && hit.uv) {
          applyPaint(hit.uv);
        }
      }
    });
  }

  // --- UI Event Listeners ---
  function setupUI() {
    document.getElementById('modeSelect').addEventListener('change', (e) => {
      activeMode = e.target.value;
      transform.detach();
      if (activeMode === 'object' && activeMesh) {
        transform.attach(activeMesh);
      }
    });

    document.getElementById('addCubeBtn').addEventListener('click', createCube);
    document.getElementById('addCurveBtn').addEventListener('click', createBezierCurve);

    // Material Changes
    document.getElementById('matColor').addEventListener('input', (e) => {
      if (activeMesh) activeMesh.material.color.set(e.target.value);
    });
    document.getElementById('matRoughness').addEventListener('input', (e) => {
      if (activeMesh) activeMesh.material.roughness = parseFloat(e.target.value);
    });
    document.getElementById('matMetalness').addEventListener('input', (e) => {
      if (activeMesh) activeMesh.material.metalness = parseFloat(e.target.value);
    });

    // Clear Texture
    document.getElementById('clearTextureBtn').addEventListener('click', () => {
      uvCtx.fillStyle = '#ffffff';
      uvCtx.fillRect(0, 0, uvCanvas.width, uvCanvas.height);
      drawUVOverlay();
      texture.needsUpdate = true;
    });

    // Curve Tweaks
    const updateCurve = () => { if (activeMode === 'curve') createBezierCurve(); };
    document.getElementById('curveExtrude').addEventListener('input', updateCurve);
    document.getElementById('curveBevel').addEventListener('input', updateCurve);

    // .OBJ Export
    document.getElementById('exportObjBtn').addEventListener('click', () => {
      if (!activeMesh) return;
      const exporter = new OBJExporter();
      const result = exporter.parse(activeMesh);
      
      const blob = new Blob([result], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'blender_web_model.obj';
      link.click();
      URL.revokeObjectURL(link.href);
    });
  }

  function onWindowResize() {
    const container = document.getElementById('viewport-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
